# ==========================================================================
# polarmed — configuracao por omissao.
#
# REGRA ARQUITETURAL (PLAN.md sec. 5): este ficheiro e o unico sitio onde
# vivem limiares, janelas e offsets de fase. Nenhum modulo a jusante de
# signal/phases.py pode conter estes numeros. Um teste de grep impoe-o.
# ==========================================================================

# --- Resultado primario, declarado ANTES de ver os dados (sec. 4.7) -------
# O pipeline RECUSA correr sem este bloco. Nao ha default silencioso.
primary_endpoint:
  metric: RMSSD
  contrast: rest_vs_mantra
  direction: increase          # hipotese direcional declarada
  declared_on: "2026-09-11"

# --- Fases (sec. 0 e 4.13). Minutos desde t_align --------------------------
# A janela guard e EXCLUIDA de todas as metricas e agregados, mas continua
# visivel nos graficos, sombreada e rotulada como transicao.
phases:
  rest:      { start_min: 0.0, end_min: 3.0 }
  guard:     { start_min: 3.0, end_min: 6.0 }
  mantra:    { start_min: 6.0, end_min: null }    # null = ate ao fim
  rest_post:                                      # sec. 4.1b — oportunista
    enabled: true
    min_duration_s: 120.0

# --- Epocas dentro da fase de mantra (sec. 6.2) ---------------------------
epochs:
  duration_min: 3.0
  names: [inicio, meio, fim]
  include_rest_as_epoch: true    # para o grafico repouso -> inicio -> meio -> fim

alignment:
  mode: recording_start          # recording_start | group_start (sec. 4.11)
  group_deviation_warn_s: 60.0

# --- Ingestao (sec. 2) ----------------------------------------------------
ingest:
  # Via primaria: metadado legivel por maquina do metrics.json
  session_types_included: [free]
  # Via de recurso: token no nome da pasta, quando nao ha metrics.json
  measurement_filter: "livre"
  session_grouping: time         # time | folder
  session_gap_hours: 2.0
  # Verificacao cruzada contra as hrv_metrics da app (sec. 2.3)
  app_metric_tolerance_pct: 5.0
  encodings_tried: [utf-8-sig, utf-8, cp1252, latin-1]

# --- Extracao e limpeza do RR (sec. 5.2) ----------------------------------
rr:
  source_priority: [native_rr, hr_column_rr, ecg_peaks, hr_1hz]
  plausible_min_ms: 300.0
  plausible_max_ms: 2000.0
  ectopic_median_window_beats: 5
  ectopic_rel_threshold: 0.22    # 22 % face a mediana movel local
  interpolation: cubic
  quality_good_max_pct: 5.0      # < 5 %  -> good
  quality_warn_max_pct: 15.0     # 5-15 % -> warn ; > 15 % -> excluded
  resample_hz: 4.0
  plot_smoothing_s: 10.0         # SO na camada de plot, nunca nas metricas

ecg:
  sampling_rate_hz: 130.0
  sampling_rate_tolerance_hz: 0.5
  bandpass_low_hz: 0.5
  bandpass_high_hz: 40.0
  powerline_hz: 50.0             # rede europeia
  peak_method: neurokit

# --- Espectro (sec. 4.3 e 4.3b) -------------------------------------------
# Parametros IDENTICOS em todas as fases. Comparar fases com janelas
# diferentes introduz uma diferenca sistematica que nao e fisiologia.
spectral:
  window_s: 60.0
  overlap: 0.5
  detrend: linear
  nfft: 1024                     # zero-padding: granularidade de leitura do pico
  peak_interpolation: parabolic
  bands:
    SLOW: [0.05, 0.12]           # respiracao lenta do canto
    LF:   [0.04, 0.15]
    HF:   [0.15, 0.40]
  lf_marginal_warning: true      # limite inferior da LF tem 2-3 bins nesta janela
  vlf_enabled: false             # sec. 4.3 — nao estimavel com janela de 60 s
  long_window:                   # segunda passagem, SO na fase de mantra
    enabled: true
    window_s: 256.0

# --- Fiabilidade por metrica (sec. 4.6) -----------------------------------
reliability:
  min_beats_time_domain: 60
  min_beats_sampen: 250
  min_beats_dfa_a1: 300
  min_welch_segments: 2

# --- Deteccao de onset do canto (sec. 4.4) --------------------------------
# Valida o offset assumido. NUNCA altera a segmentacao automaticamente.
onset:
  spectrogram_window_s: 120.0
  spectrogram_step_s: 10.0
  baseline_minutes: 2.0
  cusum_threshold: 1.0
  warn_deviation_s: 90.0
  edr:
    enabled: true
    method: r_amplitude          # r_amplitude | qrs_area
    bandpass_low_hz: 0.04
    bandpass_high_hz: 0.5
    min_confidence: 0.35         # concentracao espectral minima por janela
  emg_proxy:                     # substituto do ACC ausente (sec. 4.1b)
    band_hz: [40.0, 60.0]
    motion_threshold_rel: 2.5    # x mediana da fase de repouso

# --- HRV deslizante (painel 8) --------------------------------------------
sliding:
  window_s: 60.0
  step_s: 10.0

# --- Sincronia interpessoal (sec. 6.4 D) ----------------------------------
# So publicada se o controlo de permutacao estiver implementado.
synchrony:
  enabled: true
  window_s: 45.0
  step_s: 5.0
  permutation_n: 200
  require_permutation_null: true
  max_clock_deviation_s: 60.0

# --- Estatistica (sec. 4.5) -----------------------------------------------
stats:
  ci_exact_max_n: 7              # n <= 7 -> IC exato por estatisticas de ordem
  bootstrap_n: 10000
  multiple_comparison: holm
  forbid_significance_language: true

# --- Relatorio ------------------------------------------------------------
report:
  publish_mode: aggregate        # full | aggregate | anonymous
  max_html_mb: 6.0
  forbidden_terms:               # fazem falhar o build (sec. 4.2 e 4.5)
    - "significativo"
    - "significativa"
    - "tónus vagal"
    - "tonus vagal"
    - "prova que"
    - "comprova"
